name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with csc (.NET Framework)
        shell: cmd
        run: build.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPUTool
          path: bin/GPUTool.exe

      - name: Create release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/GPUTool.exe
          generate_release_notes: true
